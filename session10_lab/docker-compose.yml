# ClaimAssist v5 — Session 10 stack
#   model   :8090  local Qwen with an OpenAI-compatible API (llm-server:openai)
#   litellm :4000  the provider-abstraction proxy (Session 7)
#   api     :8000  ClaimAssist API v5 — registry + tracing + guardrails (NEW)
# Langfuse runs as a SEPARATE stack:  docker compose -f docker-compose.langfuse.yml up -d
# The Streamlit chat (ui/, port 8501) runs on the host.

services:
  model:
    build: ./model_server
    image: llm-server:openai
    ports:
      - "8090:8090"
    volumes:
      - hf_cache:/home/appuser/.cache/huggingface   # model download survives recreation
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8090/health', timeout=3)"]
      interval: 15s
      timeout: 5s
      retries: 30
      start_period: 180s   # first start downloads ~1 GB of weights

  litellm:
    image: ghcr.io/berriai/litellm:main-stable
    ports:
      - "4000:4000"
    volumes:
      - ./litellm:/app/litellm:ro
    command: ["--config", "/app/litellm/config.yaml", "--port", "4000"]
    env_file:
      - .env
    depends_on:
      - model
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:4000/health/liveliness', timeout=3)"]
      interval: 15s
      timeout: 5s
      retries: 10
      start_period: 30s

  api:
    build: ./api
    ports:
      - "8000:8000"
    volumes:
      - ./data:/app/data:ro
      # v5: the prompt registry is mounted, not baked into the image — a
      # prompt release is PROMPT_VERSION in .env + restart, no rebuild.
      - ./prompts:/app/prompts:ro
    environment:
      LLM_BASE_URL: http://litellm:4000/v1
      LLM_API_KEY: ${LITELLM_MASTER_KEY:-local}
      LLM_MODEL: ${LLM_MODEL:-openrouter-mini}
      API_KEY: ${API_KEY:-local-dev-key}
      # v5 — LLMOps knobs:
      PROMPT_VERSION: ${PROMPT_VERSION:-v1}
      LANGFUSE_PUBLIC_KEY: ${LANGFUSE_PUBLIC_KEY:-}
      LANGFUSE_SECRET_KEY: ${LANGFUSE_SECRET_KEY:-}
      # host.docker.internal reaches the Langfuse stack on the host port 3005
      LANGFUSE_HOST: ${LANGFUSE_HOST:-http://host.docker.internal:3005}
    extra_hosts:
      - "host.docker.internal:host-gateway"   # makes the alias work on Linux too
    depends_on:
      litellm:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health', timeout=3)"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 10s

volumes:
  hf_cache:
