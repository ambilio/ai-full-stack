# ClaimAssist v2 — Session 7 stack
#   model   :8090  local Qwen with an OpenAI-compatible API (llm-server:openai)
#   litellm :4000  the provider-abstraction proxy (NEW in v2)
#   api     :8000  ClaimAssist API — now pointed at the proxy (one env line)
# The Next.js chat (web/, port 3001) runs on the host with `npm run dev`.

services:
  model:
    build: ./model_server
    image: llm-server:openai
    ports:
      - "8090:8090"
    volumes:
      - hf_cache:/home/appuser/.cache/huggingface   # model download survives recreation
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8090/health', timeout=3)"]
      interval: 15s
      timeout: 5s
      retries: 30
      start_period: 180s   # first start downloads ~1 GB of weights

  litellm:
    image: ghcr.io/berriai/litellm:main-stable
    ports:
      - "4000:4000"
    volumes:
      - ./litellm:/app/litellm:ro   # directory mount, read-only
    command: ["--config", "/app/litellm/config.yaml", "--port", "4000"]
    env_file:
      - .env                        # cloud keys / LITELLM_MASTER_KEY, if set
    depends_on:
      - model                       # start order only; litellm boots fine alone
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:4000/health/liveliness', timeout=3)"]
      interval: 15s
      timeout: 5s
      retries: 10
      start_period: 30s

  api:
    build: ./api
    ports:
      - "8000:8000"
    volumes:
      - ./data:/app/data:ro         # directory mount, read-only
    environment:
      # THE v1 -> v2 CHANGE: one env line. Session 6 pointed this at the
      # model container (http://model:8090/v1); v2 points at the proxy.
      LLM_BASE_URL: http://litellm:4000/v1
      LLM_API_KEY: ${LITELLM_MASTER_KEY:-local}
      LLM_MODEL: qwen-local
      API_KEY: ${API_KEY:-local-dev-key}
    depends_on:
      litellm:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health', timeout=3)"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 10s

volumes:
  hf_cache:
