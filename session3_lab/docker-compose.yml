# Session 3 — two versions of the model service behind a weighted load balancer.
# v1 = stable production. v2 = release candidate. The lb splits traffic between
# them according to nginx/nginx.conf, which the canary scripts rewrite.
services:
  llm-v1:
    build: .
    image: llm-server:s3
    env_file: .env
    environment:
      VERSION: v1
      PROMPT_PREFIX: ""                    # stable behavior
    ports:
      - "8081:8080"                        # direct access for baseline evals
    mem_limit: 4g
    cpus: 2
    healthcheck: &hc
      test: ["CMD", "python", "-c",
             "import urllib.request; urllib.request.urlopen('http://localhost:8080/health')"]
      interval: 15s
      timeout: 3s
      retries: 20
      start_period: 120s

  llm-v2:
    image: llm-server:s3
    env_file: .env
    environment:
      VERSION: v2
      PROMPT_PREFIX: ${PREFIX_V2:-}        # the candidate change, from .env
    ports:
      - "8082:8080"                        # direct access for canary evals
    mem_limit: 4g
    cpus: 2
    healthcheck: *hc

  lb:
    image: nginx:1.27-alpine
    ports:
      - "8080:80"                          # the ONE stable URL users call
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
    depends_on:
      - llm-v1
      - llm-v2
