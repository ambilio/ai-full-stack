# Initial state: 100% of traffic to v1 (stable). The canary scripts rewrite
# this file and hot-reload nginx to shift traffic.
events {}
http {
  upstream llm {
    server llm-v1:8080;
  }
  server {
    listen 80;
    location / {
      proxy_pass http://llm;
      proxy_read_timeout 300s;
    }
  }
}
